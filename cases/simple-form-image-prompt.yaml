description: Simple Form (Text + Image Prompt)
vars:
  task: >
    The file packages/hsds-evals/cases/screenshots/simple-form.png is a
    screenshot of a the conversations settings screen. Read that image
    file to see the intended layout, fields, and controls, then implement the
    screen matching the design as closely as possible.
metadata:
  expectedComponents:
    - name: FormPage
    - name: FormPage.Header
      props:
        title: Conversations
    - name: Form
    - name: FormPage.Section
    - name: FormPage.Card
    - name: SwitchField
      props:
        label: Open tracking
    - name: SwitchField
      props:
        label: Enrich customer data
    - name: InputField
      props:
        label: Conversation lock
        inlineSuffix: days
    - name: InputField
      props:
        label: Next conversation
    - name: FormPage.Footer
    - name: Form.Actions
